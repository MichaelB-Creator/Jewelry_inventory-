services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend-data:/app/data
    command: ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec uvicorn main:app --reload --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/jewelry.db
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/items')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: node:22
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: ["sh", "-ec", "npm install && exec npm run dev -- --host 0.0.0.0 --port 3000"]
    ports:
      - "3000:3000"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  backend-data:
